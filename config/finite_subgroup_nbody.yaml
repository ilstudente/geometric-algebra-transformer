exp_name: finite_subgroup_nbody
run_name: ???

base_dir: ???
exp_dir: '${base_dir}/experiments/${exp_name}/${run_name}'

seed: ???
debug: false

checkpoint: null

data:
  data_dir: '${base_dir}/data/nbody'
  subsample: null

  mv_channels_in: 1
  mv_channels_out: 1

training:
  output_regularization: 0.01

  steps: 50000
  batchsize: 64
  eval_batchsize: 64

  lr: 3e-4
  lr_decay: 0.01
  clip_grad_norm: 10.0
  weight_decay: 0.0

  early_stopping: true

  float16: false
  ema: false
  ema_decay: 0.999

  log_every_n_steps: 100
  validate_every_n_steps: 1000
  plot_every_n_steps: 0
  save_model_every_n_steps: 0
  update_lr_every_n_steps: 1000

  eval_device: cpu
  progressbar: true
  detect_anomaly: false

  force_xformers: false
  enable_flash_sdp: false
  enable_math_sdp: true
  enable_mem_efficient_sdp: false

mlflow:
  db: '${base_dir}/tracking/mlflow.db'
  artifacts: '${base_dir}/tracking/artifacts'

wandb:
  enabled: false
  project: "finite_subgroup_gatr"
  entity: null
  name: ${run_name}
  dir: ${exp_dir}/wandb
  log_artifacts: false
  log_csv_files: false
  log_config_file: true

defaults:
  - model: finite_subgroup_variant_a_nbody
  - hydra
  - _self_
